services:
  frontend:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps && npm run dev -- --host 0.0.0.0 --port 3200"
    environment:
      VITE_PUBLISHING_API_URL: http://localhost:3201
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-improveit}
      POSTGRES_USER: ${POSTGRES_USER:-improveit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  publishing-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8081
      DATABASE_URL: postgres://${POSTGRES_USER:-improveit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-improveit}?sslmode=disable
      ARTICLE_IMAGE_DIR: /data/images
      STATIC_DIR: /app/dist
      PUBLISHING_API_TOKEN: ${PUBLISHING_API_TOKEN:?Set PUBLISHING_API_TOKEN in .env}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:3201:8081"
    volumes:
      - publishing_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  frontend_node_modules:
  postgres_data:
  publishing_data:
