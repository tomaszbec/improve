server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name improveit.pl;

    root /var/www/html/improveit.pl/site/;

    location = /api/webhooks/paddle {
        proxy_pass http://127.0.0.1:18180/billing/notify/paddle;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Paddle-Signature $http_paddle_signature;
        proxy_request_buffering on;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/seo-agent/ {
        proxy_pass http://127.0.0.1:18180/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30m;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/images/ {
        proxy_pass http://127.0.0.1:3201/images/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/ {
        try_files $uri @improveit_app;
    }

    location @improveit_app {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30m;
    }

    ssl_certificate /etc/letsencrypt/live/improveit.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/improveit.pl/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
}

server {
    listen 443 ssl http2;
    server_name panel.improveit.pl;

    location / {
        return 410;
    }

    ssl_certificate /etc/letsencrypt/live/panel.improveit.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.improveit.pl/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
}

server {
    listen 443 ssl http2;
    server_name backend.improveit.pl;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ssl_certificate /etc/letsencrypt/live/panel.improveit.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.improveit.pl/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
}

server {
    listen 443 ssl http2;
    server_name api.improveit.pl;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ssl_certificate /etc/letsencrypt/live/panel.improveit.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.improveit.pl/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name improveit.pl panel.improveit.pl backend.improveit.pl api.improveit.pl;
    return 301 https://$host$request_uri;
}
